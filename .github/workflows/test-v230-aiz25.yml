name: Smoke Test V2.3 AIZ25 Resolver

on:
  push:
    branches: ["v230-build"]
    paths:
      - ".github/workflows/test-v230-aiz25.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test public AirNav AIZ25 page
        shell: bash
        run: |
          set -e
          curl -fsSL --connect-timeout 3 --max-time 10             -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'             'https://www.airnavradar.com/data/flights/AIZ25'             -o /tmp/aiz25.html
          echo "bytes: $(wc -c < /tmp/aiz25.html)"
          python3 - <<'PY'
          import re, html
          s=open('/tmp/aiz25.html',errors='ignore').read()
          text=html.unescape(re.sub(r'<[^>]+>',' ',s))
          text=re.sub(r'\s+',' ',text)
          print('contains AIZ25:', 'AIZ25' in text)
          print('contains IZ25:', 'IZ25' in text)
          for pat in [
              r'(?:Mode-S|Mode S).{0,80}?([0-9A-F]{6})',
              r'([A-Z0-9]{2}-[A-Z0-9]{3})',
              r'(EI-[A-Z]{3})',
              r'(4X-[A-Z0-9]{3})'
          ]:
              m=re.search(pat,text,re.I)
              print(pat,'=>',m.group(1) if m else None)
          i=text.upper().find('AIZ25')
          if i<0: i=text.upper().find('IZ25')
          print('flight context:',text[max(0,i-400):i+1200] if i>=0 else text[:1600])
          assert 'AIZ25' in text.upper() or 'IZ25' in text.upper()
          PY
