name: Smoke Test V2.3 AIZ25 Resolver

on:
  push:
    branches: ["v230-build"]
    paths:
      - ".github/workflows/test-v230-aiz25.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Search OpenSky global live states for AIZ25
        shell: bash
        run: |
          set -e
          curl -fsSL --connect-timeout 4 --max-time 15             'https://opensky-network.org/api/states/all'             -o /tmp/states.json
          echo "bytes: $(wc -c < /tmp/states.json)"
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/states.json'))
          states=d.get('states') or []
          wanted={'AIZ25','AIZ025','IZ25','IZ025','IZ0025'}
          matches=[]
          for row in states:
              if not isinstance(row,list) or len(row)<17: continue
              cs=str(row[1] or '').strip().upper().replace(' ','')
              if cs in wanted or (re.sub(r'^([A-Z]+)0+(\d+)$',r'\1\2',cs) in wanted):
                  matches.append(row)
          print('states:',len(states),'matches:',len(matches))
          for r in matches:
              print({'hex':r[0],'callsign':r[1],'country':r[2],'lon':r[5],'lat':r[6],
                     'alt_m':r[7],'ground':r[8],'speed_mps':r[9],'heading':r[10]})
          assert matches, 'OpenSky does not currently expose AIZ25/IZ25'
          PY
