name: Build VitaFlightRadar v2.0 Slim

on:
  workflow_dispatch:
  push:
    branches: ["v200-build"]
    paths:
      - ".github/workflows/build-v200.yml"
      - "patches/v200_patch.part*.b64"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08-20260813

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct proven v1.8 source
        run: |
          cat source.part1.b64 source.part2.b64 source.part3a.b64 source.part3b.b64 source.part4.b64 source.part5.b64 | base64 -d > base.zip
          echo "435d57e62e1b8b97011271615d02bd7c9166251fdddb206731fbb2c07626b6a1  base.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('base.zip'); assert z.testzip() is None; z.extractall('.')"
          cat patches/v12_patch.part1a.b64 patches/v12_patch.part1b.b64 patches/v12_patch.part2.b64 patches/v12_patch.part3.b64 | base64 -d > v12.zip
          echo "81fd38aa36349286088a9ed04b6b0b5055fda5bf7305d093405fc011a09b4b19  v12.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v12.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          cat patches/v13_patch.part*.b64 | base64 -d > v13.zip
          echo "9a4c130f4d5ed5b4f0efcae4ec11745f87fc1bba2fcf90f877ce448c278b8487  v13.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v13.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          cat patches/v14_patch.part01.b64 patches/v14_patch.part02.b64 patches/v14_patch.part03.b64 patches/v14_patch.part04.b64 | base64 -d > v14.zip
          echo "747b1fa093bc3d376e28cab7df717f42206828fc041f55950280c1435cab1edb  v14.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v14.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          cat patches/v15_patch.part01.b64 patches/v15_patch.part02.b64 patches/v15_patch.part03.b64 patches/v15_patch.part04.b64 | base64 -d > v15.zip
          echo "ab10424241314ce2a7a1bcc4e7bba06e52684ff0e93df5ba81aab752497b8fbb  v15.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v15.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          cat patches/v16_patch.part01a.b64 patches/v16_patch.part01b.b64 patches/v16_patch.part02.b64 patches/v16_patch.part03.b64 | base64 -d > v16.zip
          echo "f143e973382a345516d66f3ea9c56ddceefec03784407910f8a7d7eab67e050f  v16.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v16.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          echo "c1f7f5c24c25d7113dedee3b8404d746a2cecf57f97f8f2c98f0f9f8984fa08b  patches/v17_patch.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('patches/v17_patch.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          cat patches/v18_patch.part01.b64 patches/v18_patch.part02.b64 patches/v18_patch.part03.b64 patches/v18_patch.part04.b64 patches/v18_patch.part05.b64 | base64 -d > v18.zip
          echo "c813625aaa9fc8b5745f3639a9dd0d10692bba1ad52aa94d41c643ea09c0213d  v18.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v18.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src')"
          echo "6e1784d4e27c75f2bd3052078a974dfd931725612a0e716f01326e258a18e14d  patches/icon_fix.zip.b64" | sha256sum -c -
          base64 -d patches/icon_fix.zip.b64 > icon_fix.zip
          echo "d746345660586920ff797c1032500baa3256e8ec5885f6d7dbf9e1e04d5710b4  icon_fix.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('icon_fix.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/sce_sys')"
          echo "7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d  VitaFlightRadar/sce_sys/icon0.png" | sha256sum -c -

      - name: Apply v1.9.2 HQ satellite patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('VitaFlightRadar/src/map.c')
          s = p.read_text()
          assert '#define MAX_ZOOM 19' in s
          s = s.replace('#define MAX_ZOOM 19', '#define MAX_ZOOM 21')
          old = '''    int target_zoom = (int)ceil(effective_zoom - 0.000001);\n    if (target_zoom < MIN_ZOOM) target_zoom = MIN_ZOOM;\n    if (target_zoom > MAX_ZOOM) target_zoom = MAX_ZOOM;\n\n    /* ceil() intentionally biases toward the sharper tile level. Residual\n       scaling is therefore <= 1, so the newly loaded imagery is downscaled\n       rather than enlarged and pixelated. */\n    double residual = pow(2.0, effective_zoom - (double)target_zoom);\n    if (residual < 0.50) residual = 0.50;\n    if (residual > 1.00) residual = 1.00;\n'''
          new = '''    int target_zoom = (int)ceil(effective_zoom - 0.000001);\n    if (target_zoom < MIN_ZOOM) target_zoom = MIN_ZOOM;\n    if (effective_zoom >= 14.0 && target_zoom < MAX_ZOOM) target_zoom++;\n    if (target_zoom > MAX_ZOOM) target_zoom = MAX_ZOOM;\n    double residual = pow(2.0, effective_zoom - (double)target_zoom);\n    if (residual < 0.24) residual = 0.24;\n    if (residual > 1.00) residual = 1.00;\n'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace('"SATELLITE SHARPENING Z%d"', '"HQ SATELLITE Z%d"')
          p.write_text(s)
          h = Path('VitaFlightRadar/src/map.h')
          h.write_text(h.read_text().replace('#define VFR_MAP_MAX_TILES 32', '#define VFR_MAP_MAX_TILES 40'))
          PY

      - name: Apply v1.9.3 dual-model compatibility patch
        run: |
          echo "3e80bbb72c120b34970ad7401034e1eb71c8373fee0d59f3e18b9cc14688929e  patches/v193_patch.part00.b64" | sha256sum -c -
          echo "c25bff58f03e092aca79a828bdcdeabfa6180428e8560238d9c8a73dfc26e9c8  patches/v193_patch.part01.b64" | sha256sum -c -
          echo "fa3fb25678f07f272cffb5312c96713e388b6d8adecee693e5835287efa51f0f  patches/v193_patch.part02.b64" | sha256sum -c -
          echo "08c46fead75a991bbb5f075d9a3811a9c6c4c8bcdb280355b6b5ec771d220102  patches/v193_patch.part03.b64" | sha256sum -c -
          cat patches/v193_patch.part00.b64 patches/v193_patch.part01.b64 patches/v193_patch.part02.b64 patches/v193_patch.part03.b64 | base64 -d > v193.zip
          echo "74c99e50e4a529a62b45eebafd0095396b6565d9ca85a1da6a4bb6faf4eb5d6e  v193.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('v193.zip')
          assert z.testzip() is None
          z.extractall('VitaFlightRadar/src')
          print('v1.9.3 compatibility patch OK')
          PY
          grep -q 'CURL_SSLVERSION_TLSv1_2' VitaFlightRadar/src/net.c
          grep -q 'SATELLITE FALLBACK' VitaFlightRadar/src/map.c


      - name: Apply v2.0 Slim search and follow patch
        run: |
          cat patches/v200_patch.part00.b64 patches/v200_patch.part01.b64 patches/v200_patch.part02.b64 patches/v200_patch.part03.b64 patches/v200_patch.part04.b64 patches/v200_patch.part05.b64 | base64 -d > v200.zip
          echo "7b46a30565f5e3208b34ba6944765831429bae529fd6f23229078c6c736b4737  v200.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('v200.zip')
          assert z.testzip() is None
          z.extractall('VitaFlightRadar/src')
          print('v2.0 Slim feature patch OK')
          PY
          grep -q 'SEARCH FLIGHT NUMBER' VitaFlightRadar/src/main.c
          grep -q '/api/v2/callsign/' VitaFlightRadar/src/main.c
          grep -q '4000000ULL' VitaFlightRadar/src/main.c
          grep -q 'recent%d=' VitaFlightRadar/src/app_config.c
          grep -q 'VitaFlightRadar/2.0 (PS Vita Slim PCH-2000 homebrew)' VitaFlightRadar/src/net.c

      - name: Install firmware-independent TLS backend
        run: |
          vdpm pacman -- -Rdd --noconfirm curl
          vdpm pacman -- -S --needed --noconfirm curl-mbedtls mbedtls
          vdpm info curl-mbedtls

      - name: Build Vita-safe Jansson 2.15.1
        run: |
          git clone --depth 1 --branch v2.15.1 https://github.com/akheron/jansson.git jansson-src
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jansson-src/CMakeLists.txt')
          p.write_text(p.read_text().replace('POSITION_INDEPENDENT_CODE true','POSITION_INDEPENDENT_CODE false'))
          PY
          cmake -S jansson-src -B jansson-build \
            -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=OFF \
            -DCMAKE_C_FLAGS='-O3 -fno-pic -fno-pie' \
            -DJANSSON_BUILD_DOCS=OFF -DJANSSON_EXAMPLES=OFF -DJANSSON_WITHOUT_TESTS=ON
          cmake --build jansson-build --parallel
          JANSSON_LIB="$(find jansson-build -name libjansson.a -type f | head -n 1)"
          test -n "$JANSSON_LIB"
          cp "$JANSSON_LIB" VitaFlightRadar/libjansson_vita.a

      - name: Upload reconstructed v2.0 Slim source
        uses: actions/upload-artifact@v4
        with:
          name: VitaFlightRadar-v2.0-Slim-source
          path: VitaFlightRadar
          if-no-files-found: error

      - name: Configure v2.0 Slim
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('VitaFlightRadar/CMakeLists.txt')
          s=p.read_text()
          s=s.replace('set(VITA_VERSION "01.00")','set(VITA_VERSION "02.00")')
          s=s.replace('find_package(OpenSSL REQUIRED)\n','')
          s=s.replace('    ${OPENSSL_INCLUDE_DIR}\n','')
          s=s.replace('    ${OPENSSL_LIBRARIES}\n','')
          s=s.replace('    jansson\n','    ${CMAKE_SOURCE_DIR}/libjansson_vita.a\n')
          s=s.replace('    src/net.c\n)','    src/net.c\n    src/map.c\n    src/route.c\n)')
          s=s.replace('    SceKernelThreadMgr_stub\n','    SceKernelThreadMgr_stub\n    SceRtc_stub\n    SceAppUtil_stub\n    SceIme_stub\n')
          s=s.replace('set(CMAKE_C_STANDARD_REQUIRED ON)','set(CMAKE_C_STANDARD_REQUIRED ON)\nset(CMAKE_POSITION_INDEPENDENT_CODE OFF)\nadd_compile_options(-O3 -fomit-frame-pointer -fno-pic -fno-pie)\nadd_link_options(-no-pie -Wl,--gc-sections)')
          s=s.replace('target_include_directories(${PROJECT_NAME} PRIVATE','set_target_properties(${PROJECT_NAME} PROPERTIES POSITION_INDEPENDENT_CODE OFF)\n\ntarget_include_directories(${PROJECT_NAME} PRIVATE')
          s += '\n# Vita pthread symbols live in archive members that static linking may otherwise skip.\ntarget_link_libraries(${PROJECT_NAME} -Wl,--whole-archive pthread -Wl,--no-whole-archive)\n'
          p.write_text(s)
          PY
          cmake -S VitaFlightRadar -B VitaFlightRadar/build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: cmake --build VitaFlightRadar/build --parallel

      - name: Verify package
        run: |
          python3 - <<'PY'
          import zipfile, hashlib
          p='VitaFlightRadar/build/VitaFlightRadar.vpk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('sce_sys/icon0.png')).hexdigest()=='7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d'
              assert 'default_location.txt' not in z.namelist()
          print('v2.0 Slim VPK integrity OK')
          PY

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaFlightRadar-v2.0-Slim-VPK
          path: VitaFlightRadar/build/VitaFlightRadar.vpk
          if-no-files-found: error


      - name: Publish Slim V2 VPK and docs to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          from pathlib import Path

          token=os.environ["GH_TOKEN"]
          repo=os.environ["GITHUB_REPOSITORY"]
          api="https://api.github.com/repos/"+repo+"/contents/"

          def request(method, path, payload=None):
              url=api+path
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization","Bearer "+token)
              req.add_header("Accept","application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version","2022-11-28")
              req.add_header("User-Agent","VitaFlightRadar-build")
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  if e.code==404: return None
                  raise

          def get_text(path):
              obj=request("GET",path+"?ref=main")
              if not obj: raise RuntimeError("missing "+path)
              return base64.b64decode(obj["content"]).decode(), obj["sha"]

          def put_bytes(path, raw, message, sha=None):
              payload={"message":message,"content":base64.b64encode(raw).decode(),"branch":"main"}
              if sha: payload["sha"]=sha
              return request("PUT",path,payload)

          def put_text(path, text, message, sha):
              return put_bytes(path,text.encode(),message,sha)

          def between(s,a,b,repl):
              i=s.index(a); j=s.index(b,i+len(a))
              return s[:i]+repl+s[j:]

          vpk=Path("VitaFlightRadar/build/VitaFlightRadar.vpk").read_bytes()
          existing=request("GET","releases/VitaFlightRadar-v2.0-Slim.vpk?ref=main")
          put_bytes("releases/VitaFlightRadar-v2.0-Slim.vpk",vpk,
                    "Publish VitaFlightRadar v2.0 Slim VPK",
                    existing["sha"] if existing else None)

          readme,sha=get_text("README.md")
          readme=between(readme,"## Download — choose your PS Vita model\n","## Current feature set\n","""## Download

### PS Vita 2000 Slim — PCH-20xx

**Current feature release: VitaFlightRadar v2.0 Slim**

### **[Download VitaFlightRadar v2.0 — PCH-2000 Slim](releases/VitaFlightRadar-v2.0-Slim.vpk)**

V2.0 is the current main project build and is developed for the **PS Vita Slim / PCH-2000**. It adds the new Search Hub, live flight-number search and following, three saved recent coordinate searches, touch + button menu navigation, and permanent 4-second live aircraft refresh.

### PS Vita 1000 FAT / OLED — PCH-10xx / PCH-11xx

**Legacy compatibility build: v1.9.3-PCH1000**

### **[Download VitaFlightRadar v1.9.3 — PCH-1000 FAT/OLED](releases/VitaFlightRadar-v1.9.3-PCH1000.vpk)**

The FAT/OLED edition is currently frozen at v1.9.3 while feature development focuses exclusively on the PCH-2000 Slim. After the Slim feature set is complete and thoroughly tested, the finished application can be ported back to the PCH-1000 compatibility path.

See [RELEASES.md](RELEASES.md) for the release index and [CHANGELOG.md](CHANGELOG.md) for the complete development history.

""")
          readme=between(readme,"## Current feature set\n","## Controls\n","""## Current feature set

- Live nearby aircraft positions over satellite imagery.
- One-finger map panning, touch-and-hold recentering and two-finger pinch zoom.
- Tap aircraft to select them, or use UP / DOWN to cycle through aircraft.
- **Triangle Search Hub** with coordinate search and flight-number search.
- Search menus work with the **front touchscreen** or **D-pad + X**.
- Coordinate search remembers the **three most recent coordinates** across launches.
- Flight-number/callsign search accepts entries such as `ELY5230`, finds the live aircraft and moves the map to it.
- **FOLLOW mode** keeps the map centered on a searched aircraft as new live positions arrive.
- Aircraft data refresh is **always automatic every 4 seconds**.
- Selected-flight information includes altitude, speed, heading, distance and route/timetable data when public data is available.
- Persistent satellite tile caching and high-resolution satellite sharpening at close zoom levels.

""")
          readme=between(readme,"## Controls\n","There is intentionally no separate hardware zoom or aircraft-radius control.","""## Controls

| Control | Action |
| --- | --- |
| **One-finger drag** | Pan the satellite map |
| **Stationary touch-and-hold** | Recenter under your finger |
| **Two-finger pinch** | Zoom map and adjust aircraft search radius |
| **Tap aircraft** | Select aircraft and leave FOLLOW mode |
| **Triangle** | Open the Search Hub |
| **UP / DOWN** | Navigate menus or cycle aircraft |
| **X** | Confirm / Enter |
| **Circle** | Cancel / Back |
| **Square** | Unused in v2.0 |
| **START** | Unused in v2.0 |
| **PS button** | Leave / suspend through Vita system UI |

""")
          readme=between(readme,"## AUTO vs MANUAL\n","## Coordinate search\n","""## Automatic refresh and flight following

V2.0 no longer has AUTO/MANUAL modes. Live aircraft refresh is always enabled and runs approximately every **4 seconds**.

When a flight is found through flight-number search, VitaFlightRadar enters **FOLLOW mode** and recenters on its newest reported position while the aircraft remains available in the live feed.

""")
          readme=between(readme,"## Coordinate search\n","## Installing on a PS Vita\n","""## Search Hub

Press **Triangle** to choose **Enter Coordinates** or **Search Flight Number**.

Coordinate search accepts decimal coordinates such as `40.7128,-74.0060` and remembers the latest **three** searches across launches.

Flight search accepts a live callsign/flight number such as `ELY5230`. Spaces and letter case are normalized automatically. When found, the map jumps to the aircraft, selects it and enters FOLLOW mode.

The menus work with either the **front touchscreen** or **D-pad + X**. Use **Circle** to go back.

""")
          readme=between(readme,"## Model-specific builds\n","## Version history\n","""## Model-specific builds

V2 feature development currently targets the **PCH-2000 Slim only**.

- **PCH-2000 Slim:** v2.0 is the current feature release.
- **PCH-1000 FAT/OLED:** v1.9.3-PCH1000 remains available as the existing compatibility build.

The PCH-1000 version will be revisited after the Slim application reaches the final feature set.

""")
          readme=readme.replace(
              "The dedicated PCH-1000 build is maintained on the `pch1000-build` development branch and is built separately from the proven PCH-2000 release.",
              "Current feature development is maintained on the `v200-build` branch for the PCH-2000 Slim. The PCH-1000 compatibility branch is intentionally paused until the Slim feature set is complete.")
          put_text("README.md",readme,"Document VitaFlightRadar v2.0 Slim",sha)

          changelog,sha=get_text("CHANGELOG.md")
          if "## v2.0 Slim" not in changelog:
              block="""## v2.0 Slim

Major search and live-flight-following update for the PS Vita Slim / PCH-2000.

- Triangle now opens a Search Hub with coordinate search and flight-number search.
- Search menus support front-touch selection and D-pad UP/DOWN + X.
- Added persistent storage for the three most recent coordinate searches.
- Added live flight-number/callsign search and automatic map jump to the aircraft.
- Added FOLLOW mode so the map recenters as new live aircraft positions arrive.
- Removed the Square AUTO/MANUAL toggle.
- START is intentionally unused in v2.0.
- Aircraft refresh is permanently automatic at approximately four seconds.
- V2 feature development currently targets PCH-2000 Slim only.
- Built successfully with VitaSDK and passed VPK integrity validation.

"""
              changelog=changelog.replace("## v1.9.3-PCH1000",block+"## v1.9.3-PCH1000")
          put_text("CHANGELOG.md",changelog,"Add v2.0 Slim changelog",sha)

          releases,sha=get_text("RELEASES.md")
          releases="""# VitaFlightRadar Releases

## PS Vita 2000 Slim — PCH-20xx

**Current release: v2.0 Slim**

### [Download VitaFlightRadar v2.0 Slim](releases/VitaFlightRadar-v2.0-Slim.vpk)

V2.0 is the current main release for the **PS Vita Slim / PCH-2000**.

Highlights:

- Triangle Search Hub
- Coordinate search plus three recent saved coordinate searches
- Live flight-number/callsign search
- Automatic jump to a searched aircraft
- Continuous FOLLOW mode
- Touchscreen or D-pad + X menu control
- Permanent 4-second aircraft refresh
- Square and START intentionally unused
- Existing satellite map, pan, pinch zoom, aircraft selection, route data and tile caching retained
- Passed VitaSDK compilation and VPK integrity validation

## PS Vita 1000 FAT / OLED — PCH-10xx / PCH-11xx

**Current compatibility build: v1.9.3-PCH1000**

### [Download VitaFlightRadar v1.9.3 PCH-1000](releases/VitaFlightRadar-v1.9.3-PCH1000.vpk)

The PCH-1000 edition is paused while active feature development focuses on the Slim. The completed Slim feature set can be ported back after the Slim application reaches its final form.

## Historical versions

See [CHANGELOG.md](CHANGELOG.md) for the complete development history.

| Version | Status | Major milestone |
| --- | --- | --- |
| **v2.0 Slim** | **Current PCH-2000 release** | Search Hub, saved coordinates, flight search, FOLLOW mode, always-on 4-second refresh |
| **v1.9.3-PCH1000** | PCH-1000 compatibility build | Dedicated FAT networking/cache/satellite compatibility |
| **v1.9.2** | Previous PCH-2000 release | High-resolution satellite improvements |
| **v1.9.1 and earlier** | Historical | Previous VitaFlightRadar development |
"""
          put_text("RELEASES.md",releases,"Make v2.0 Slim the current release",sha)

          print("Published V2 Slim VPK and public docs to main")
          PY
