name: Materialize v193 Source

on:
  push:
    branches:
      - v200-build
    paths:
      - .github/workflows/materialize-v193-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.9.3 source tree
        shell: bash
        run: |
          set -e
          cat source.part1.b64 source.part2.b64 source.part3a.b64 source.part3b.b64 source.part4.b64 source.part5.b64 | base64 -d > base.zip
          unzip -q -o base.zip

          cat patches/v12_patch.part1a.b64 patches/v12_patch.part1b.b64 patches/v12_patch.part2.b64 patches/v12_patch.part3.b64 | base64 -d > v12.zip
          unzip -q -o v12.zip -d VitaFlightRadar/src

          cat patches/v13_patch.part*.b64 | base64 -d > v13.zip
          unzip -q -o v13.zip -d VitaFlightRadar/src

          cat patches/v14_patch.part01.b64 patches/v14_patch.part02.b64 patches/v14_patch.part03.b64 patches/v14_patch.part04.b64 | base64 -d > v14.zip
          unzip -q -o v14.zip -d VitaFlightRadar/src

          cat patches/v15_patch.part01.b64 patches/v15_patch.part02.b64 patches/v15_patch.part03.b64 patches/v15_patch.part04.b64 | base64 -d > v15.zip
          unzip -q -o v15.zip -d VitaFlightRadar/src

          cat patches/v16_patch.part01a.b64 patches/v16_patch.part01b.b64 patches/v16_patch.part02.b64 patches/v16_patch.part03.b64 | base64 -d > v16.zip
          unzip -q -o v16.zip -d VitaFlightRadar/src

          unzip -q -o patches/v17_patch.zip -d VitaFlightRadar/src

          cat patches/v18_patch.part01.b64 patches/v18_patch.part02.b64 patches/v18_patch.part03.b64 patches/v18_patch.part04.b64 patches/v18_patch.part05.b64 | base64 -d > v18.zip
          unzip -q -o v18.zip -d VitaFlightRadar/src

          python3 -c "from pathlib import Path; p=Path('VitaFlightRadar/src/map.c'); s=p.read_text(); s=s.replace('#define MAX_ZOOM 19','#define MAX_ZOOM 21'); s=s.replace('if (target_zoom > MAX_ZOOM) target_zoom = MAX_ZOOM;\\n\\n    /* ceil() intentionally biases toward the sharper tile level. Residual\\n       scaling is therefore <= 1, so the newly loaded imagery is downscaled\\n       rather than enlarged and pixelated. */\\n    double residual = pow(2.0, effective_zoom - (double)target_zoom);\\n    if (residual < 0.50) residual = 0.50;','if (effective_zoom >= 14.0 && target_zoom < MAX_ZOOM) target_zoom++;\\n    if (target_zoom > MAX_ZOOM) target_zoom = MAX_ZOOM;\\n    double residual = pow(2.0, effective_zoom - (double)target_zoom);\\n    if (residual < 0.24) residual = 0.24;'); s=s.replace('SATELLITE SHARPENING Z%d','HQ SATELLITE Z%d'); p.write_text(s); h=Path('VitaFlightRadar/src/map.h'); h.write_text(h.read_text().replace('#define VFR_MAP_MAX_TILES 32','#define VFR_MAP_MAX_TILES 40'))"

          cat patches/v193_patch.part00.b64 patches/v193_patch.part01.b64 patches/v193_patch.part02.b64 patches/v193_patch.part03.b64 | base64 -d > v193.zip
          unzip -q -o v193.zip -d VitaFlightRadar/src

          rm -f base.zip v12.zip v13.zip v14.zip v15.zip v16.zip v18.zip v193.zip

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -e
          git config user.name "VitaFlightRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add VitaFlightRadar
          git diff --cached --quiet && exit 0
          git commit -m "Materialize v1.9.3 source for Slim v2 development"
          git push
