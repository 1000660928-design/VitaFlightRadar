name: Publish VitaFlightRadar v1.7

on:
  workflow_dispatch:
  push:
    branches: ["v17-build"]
    paths:
      - ".github/workflows/publish-v17.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified v1.7 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/1000660928-design/VitaFlightRadar/actions/artifacts/10496915387/zip" \
            -o v17-artifact.zip
          unzip -q v17-artifact.zip -d v17-artifact
          test -f v17-artifact/VitaFlightRadar.vpk

      - name: Verify VPK before publishing
        run: |
          python3 - <<'PY'
          import zipfile, hashlib
          p='v17-artifact/VitaFlightRadar.vpk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('sce_sys/icon0.png')).hexdigest() == '7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d'
          print('Verified VitaFlightRadar v1.7 VPK')
          PY

      - name: Publish permanent download to main
        run: |
          mkdir -p releases
          cp v17-artifact/VitaFlightRadar.vpk releases/VitaFlightRadar-v1.7.vpk
          git config user.name "VitaFlightRadar Builder"
          git config user.email "actions@users.noreply.github.com"
          git add releases/VitaFlightRadar-v1.7.vpk
          git commit -m "Publish VitaFlightRadar v1.7 VPK" || exit 0
          git push origin main
