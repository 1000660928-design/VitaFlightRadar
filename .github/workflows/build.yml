name: Build VitaFlightRadar VPK

on:
  workflow_dispatch:
  push:
    branches: ["v13-build"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08-20260813

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct base source
        run: |
          cat source.part1.b64 source.part2.b64 source.part3a.b64 source.part3b.b64 source.part4.b64 source.part5.b64 | base64 -d > VitaFlightRadar-v1.0-source.zip
          echo "435d57e62e1b8b97011271615d02bd7c9166251fdddb206731fbb2c07626b6a1  VitaFlightRadar-v1.0-source.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('VitaFlightRadar-v1.0-source.zip'); assert z.testzip() is None; z.extractall('.'); print('Base source OK')"

      - name: Reconstruct and apply v1.2 patch
        run: |
          echo "8b13159515d20a67afd89488489a494c07c88c91882ecfea1093fd1563bf5ef2  patches/v12_patch.part1a.b64" | sha256sum -c -
          echo "b0f19fe4392d0c3c07a862e5325b47cd68f6b5ef666d4e230214ab204e182a59  patches/v12_patch.part1b.b64" | sha256sum -c -
          echo "bbae9a0e369054964216f29efaeec4dd502f8f8481cff7e3d329478613f764b5  patches/v12_patch.part2.b64" | sha256sum -c -
          echo "6f6057c1794af4e19191974f7ff55b0bc468e8cd856b98b9efcc1e0cd6079dd5  patches/v12_patch.part3.b64" | sha256sum -c -
          cat patches/v12_patch.part1a.b64 patches/v12_patch.part1b.b64 patches/v12_patch.part2.b64 patches/v12_patch.part3.b64 | base64 -d > v12_patch.zip
          echo "81fd38aa36349286088a9ed04b6b0b5055fda5bf7305d093405fc011a09b4b19  v12_patch.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v12_patch.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src'); print('v1.2 patch applied:', len(z.namelist()), 'files')"

      - name: Reconstruct and apply v1.3 patch
        run: |
          echo "7a5898edbb3cdb8356397b35a0fca13aff023ec39510e34e033263cb4e0b76dd  patches/v13_patch.part01.b64" | sha256sum -c -
          echo "5a4689d70bafe54cbd29baabcc89efd0f43fa1d7fa2ef972b161495ca8bfc8de  patches/v13_patch.part02.b64" | sha256sum -c -
          echo "9ee25da4b7fd411c8eaf1d38b93d6819ee7aa8f42d04e181bd20c262c8855349  patches/v13_patch.part03.b64" | sha256sum -c -
          echo "c7663f8d85821149bef884cb4c87db66da56de28d2a3e067bc924c947e327232  patches/v13_patch.part04.b64" | sha256sum -c -
          echo "167523063c0dea069552945e12e7d65ec2706d0e49441eb6d7af4e7238e61354  patches/v13_patch.part05.b64" | sha256sum -c -
          echo "7feed3af2119a72c4d336887d069917895fbb5fffe95d12bd42054113f807b63  patches/v13_patch.part06.b64" | sha256sum -c -
          cat patches/v13_patch.part*.b64 | base64 -d > v13_patch.zip
          echo "9a4c130f4d5ed5b4f0efcae4ec11745f87fc1bba2fcf90f877ce448c278b8487  v13_patch.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('v13_patch.zip'); assert z.testzip() is None; z.extractall('VitaFlightRadar/src'); print('v1.3 patch applied:', len(z.namelist()), 'files')"
          base64 -d patches/icon0_fixed.b64 > VitaFlightRadar/sce_sys/icon0.png
          echo "7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d  VitaFlightRadar/sce_sys/icon0.png" | sha256sum -c -

      - name: Build Vita-safe Jansson 2.15.1
        run: |
          git clone --depth 1 --branch v2.15.1 https://github.com/akheron/jansson.git jansson-src
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jansson-src/CMakeLists.txt')
          s = p.read_text()
          old = 'set_target_properties(jansson PROPERTIES\n      POSITION_INDEPENDENT_CODE true)'
          new = 'set_target_properties(jansson PROPERTIES\n      POSITION_INDEPENDENT_CODE false)'
          if old not in s:
              raise SystemExit('Could not find Jansson forced PIC setting')
          p.write_text(s.replace(old, new))
          PY
          cmake -S jansson-src -B jansson-build \
            -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=OFF \
            -DCMAKE_C_FLAGS='-fno-pic -fno-pie' \
            -DJANSSON_BUILD_DOCS=OFF \
            -DJANSSON_EXAMPLES=OFF \
            -DJANSSON_WITHOUT_TESTS=ON
          cmake --build jansson-build --parallel
          JANSSON_LIB="$(find jansson-build -name libjansson.a -type f | head -n 1)"
          test -n "$JANSSON_LIB"
          cp "$JANSSON_LIB" VitaFlightRadar/libjansson_vita.a
          if arm-vita-eabi-readelf -rW "$JANSSON_LIB" 2>/dev/null | grep -q R_ARM_BASE_PREL; then
            echo 'ERROR: custom Jansson still contains R_ARM_BASE_PREL'
            exit 1
          fi

      - name: Configure VitaSDK project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('VitaFlightRadar/CMakeLists.txt')
          s = p.read_text()
          s = s.replace('set(VITA_VERSION "01.00")', 'set(VITA_VERSION "01.30")')
          s = s.replace('find_package(CURL REQUIRED)\n', '')
          s = s.replace('find_package(OpenSSL REQUIRED)\n', '')
          s = s.replace('    ${CURL_INCLUDE_DIRS}\n', '')
          s = s.replace('    ${OPENSSL_INCLUDE_DIR}\n', '')
          s = s.replace('    ${CURL_LIBRARIES}\n', '')
          s = s.replace('    ${OPENSSL_LIBRARIES}\n', '')
          s = s.replace('    jansson\n', '    ${CMAKE_SOURCE_DIR}/libjansson_vita.a\n')
          s = s.replace('    src/net.c\n)', '    src/net.c\n    src/map.c\n    src/route.c\n)')
          s = s.replace('    SceKernelThreadMgr_stub\n', '    SceKernelThreadMgr_stub\n    SceRtc_stub\n')
          s = s.replace('set(CMAKE_C_STANDARD_REQUIRED ON)', 'set(CMAKE_C_STANDARD_REQUIRED ON)\nset(CMAKE_POSITION_INDEPENDENT_CODE OFF)\nadd_compile_options(-fno-pic -fno-pie)\nadd_link_options(-no-pie)')
          s = s.replace('target_include_directories(${PROJECT_NAME} PRIVATE', 'set_target_properties(${PROJECT_NAME} PROPERTIES POSITION_INDEPENDENT_CODE OFF)\n\ntarget_include_directories(${PROJECT_NAME} PRIVATE')
          p.write_text(s)
          PY
          cmake -S VitaFlightRadar -B VitaFlightRadar/build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: cmake --build VitaFlightRadar/build --parallel

      - name: Verify package icon
        run: |
          python3 - <<'PY'
          import zipfile, hashlib
          p='VitaFlightRadar/build/VitaFlightRadar.vpk'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              assert bad is None, bad
              icon=z.read('sce_sys/icon0.png')
              assert hashlib.sha256(icon).hexdigest() == '7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d'
              print('VPK ZIP integrity + icon OK')
          PY

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaFlightRadar-v1.3-VPK
          path: VitaFlightRadar/build/VitaFlightRadar.vpk
          if-no-files-found: error
