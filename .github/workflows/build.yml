name: Build VitaFlightRadar VPK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08-20260813

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source chunks
        run: |
          echo "12fa1cfa9f065a1f11a1677d58ec2832dd1a6365582c43a74d2aa0788139d8db  source.part1.b64" | sha256sum -c -
          echo "699d1f528e1446ab94f349ffc28262fb0873096b6ca0201cb75241c2ba799979  source.part2.b64" | sha256sum -c -
          echo "a220d41a021f3b0ad60e60a0ed362f3df2a949450ec4cc0db3930564e085bf6f  source.part3a.b64" | sha256sum -c -
          echo "6eac1b31ce2e1d42498df6feb86799b65a00990458ab371cfa287034442fe6c4  source.part3b.b64" | sha256sum -c -
          echo "bda84132fb7ccc74ba20ff9ef7220d37044452db14439820400d0dd258ddce6b  source.part4.b64" | sha256sum -c -
          echo "7f4ee50e51dc055a04ec6f9412e2de0fc3acee1164d36eb044d9de6d085d3aaa  source.part5.b64" | sha256sum -c -

      - name: Reconstruct source archive
        run: cat source.part1.b64 source.part2.b64 source.part3a.b64 source.part3b.b64 source.part4.b64 source.part5.b64 | base64 -d > VitaFlightRadar-v1.0-source.zip

      - name: Verify source archive
        run: |
          echo "435d57e62e1b8b97011271615d02bd7c9166251fdddb206731fbb2c07626b6a1  VitaFlightRadar-v1.0-source.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('VitaFlightRadar-v1.0-source.zip'); assert z.testzip() is None; print('ZIP OK:', len(z.namelist()), 'files')"

      - name: Extract VitaFlightRadar source
        run: python3 -c "import zipfile; zipfile.ZipFile('VitaFlightRadar-v1.0-source.zip').extractall('.')"

      - name: Apply VitaSDK compatibility fixes
        run: |
          cp patches/native_net.c VitaFlightRadar/src/net.c
          python3 - <<'PY'
          from pathlib import Path

          p = Path('VitaFlightRadar/src/app_config.c')
          s = p.read_text()
          if '#include <psp2/io/stat.h>' not in s:
              s = s.replace('#include <psp2/io/fcntl.h>', '#include <psp2/io/fcntl.h>\n#include <psp2/io/stat.h>')
          p.write_text(s)

          p = Path('VitaFlightRadar/CMakeLists.txt')
          s = p.read_text()
          s = s.replace('find_package(CURL REQUIRED)\n', '')
          s = s.replace('find_package(OpenSSL REQUIRED)\n', '')
          s = s.replace('    ${CURL_INCLUDE_DIRS}\n', '')
          s = s.replace('    ${OPENSSL_INCLUDE_DIR}\n', '')
          s = s.replace('    ${CURL_LIBRARIES}\n', '')
          s = s.replace('    ${OPENSSL_LIBRARIES}\n', '')
          s = s.replace('set(CMAKE_C_STANDARD_REQUIRED ON)', 'set(CMAKE_C_STANDARD_REQUIRED ON)\nset(CMAKE_POSITION_INDEPENDENT_CODE OFF)\nadd_compile_options(-fno-pic -fno-pie)\nadd_link_options(-no-pie -Wl,-Map=VitaFlightRadar.map)')
          s = s.replace('target_include_directories(${PROJECT_NAME} PRIVATE', 'set_target_properties(${PROJECT_NAME} PROPERTIES POSITION_INDEPENDENT_CODE OFF)\n\ntarget_include_directories(${PROJECT_NAME} PRIVATE')
          p.write_text(s)
          PY

      - name: Configure VitaSDK build
        working-directory: VitaFlightRadar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build linked ARM ELF only
        working-directory: VitaFlightRadar
        run: cmake --build build --target VitaFlightRadar --parallel

      - name: Diagnose unsupported relocations
        working-directory: VitaFlightRadar
        run: |
          echo '=== R_ARM_BASE_PREL relocations in final linked ELF ==='
          arm-vita-eabi-readelf -rW build/VitaFlightRadar | grep -C 4 'R_ARM_BASE_PREL' || true
          echo '=== Dynamic/relocation sections ==='
          arm-vita-eabi-readelf -SW build/VitaFlightRadar | grep -E 'rel|dyn|got|plt' || true
          echo '=== Suspect symbols in linker map ==='
          arm-vita-eabi-readelf -rW build/VitaFlightRadar | awk '/R_ARM_BASE_PREL/ {print $NF}' | sort -u | while read sym; do echo "--- $sym ---"; grep -n -C 3 "$sym" build/VitaFlightRadar.map || true; done

      - name: Build VPK
        working-directory: VitaFlightRadar
        run: cmake --build build --parallel

      - name: Upload installable VPK
        uses: actions/upload-artifact@v4
        with:
          name: VitaFlightRadar-VPK
          path: VitaFlightRadar/build/VitaFlightRadar.vpk
          if-no-files-found: error
