name: Publish VitaFlightRadar v2.5

on:
  push:
    branches: ["v250-build"]
    paths:
      - ".github/workflows/publish-v250.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v2.5 VPK
        uses: actions/download-artifact@v4
        with:
          name: VitaFlightRadar-v2.5-Test-VPK
          path: release_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37210615559

      - name: Publish neutral public download filenames
        run: |
          mkdir -p releases
          cp release_artifact/VitaFlightRadar.vpk releases/VitaFlightRadar-v2.5.vpk
          cp releases/VitaFlightRadar-v2.0-Slim.vpk releases/VitaFlightRadar-v2.0.vpk
          cp releases/VitaFlightRadar-v1.9.3-PCH1000.vpk releases/VitaFlightRadar-v1.9.3-Compatibility.vpk

      - name: Commit public release files
        run: |
          git config user.name "VitaFlightRadar Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add releases/VitaFlightRadar-v2.5.vpk releases/VitaFlightRadar-v2.0.vpk releases/VitaFlightRadar-v1.9.3-Compatibility.vpk
          git commit -m "Publish VitaFlightRadar v2.5"
          git push origin main
