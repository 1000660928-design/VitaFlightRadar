name: Smoke Test V2.4 Generic Flight Resolver

on:
  push:
    branches: ["v240-build"]
    paths:
      - ".github/workflows/test-v240-resolver.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check direct ADS-B callsign providers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          providers=[
            'https://opendata.adsb.fi/api/v2/callsign/NBT50K',
            'https://api.adsb.lol/v2/callsign/NBT50K',
            'https://api.airplanes.live/v2/callsign/NBT50K',
          ]
          successes=[]
          for u in providers:
              try:
                  raw=subprocess.check_output(['curl','-fsSL','--connect-timeout','4','--max-time','8',u],text=True)
                  d=json.loads(raw)
                  ac=d.get('ac') or d.get('aircraft') or []
                  print(u,'aircraft',len(ac))
                  if ac: successes.append(u)
              except Exception as e:
                  print(u,'unavailable',e)
          print('direct provider successes:',successes)
          PY

      - name: Verify commercial search resolves both identifier families
        shell: bash
        run: |
          set -e
          ok=0
          for q in NBT50K N0503; do
            echo "=== $q ==="
            if curl -fsSL --connect-timeout 4 --max-time 10 -A 'Mozilla/5.0'               "https://www.flightradar24.com/v1/search/web/find?query=$q&limit=20"               -o "/tmp/$q.json"; then
              python3 - "$q" <<'PY'
          import json,sys
          q=sys.argv[1]
          d=json.load(open('/tmp/'+q+'.json'))
          rows=d.get('results') or []
          live=[r for r in rows if 'live' in str(r.get('type','')).lower()]
          print(q,'results',len(rows),'live',len(live))
          for r in live[:5]:
              print({'id':r.get('id'),'label':r.get('label'),'name':r.get('name'),'detail':r.get('detail')})
          if live:
              open('/tmp/resolved-'+q,'w').write('1')
          PY
            fi
          done
          test -f /tmp/resolved-NBT50K -o -f /tmp/resolved-N0503

      - name: Check OpenSky only as final fallback
        shell: bash
        run: |
          set +e
          curl -fsSL --connect-timeout 4 --max-time 15             'https://opensky-network.org/api/states/all' -o /tmp/states.json
          python3 - <<'PY'
          import json,os
          if not os.path.exists('/tmp/states.json'):
              print('OpenSky unavailable; acceptable because it is only a fallback')
              raise SystemExit(0)
          d=json.load(open('/tmp/states.json'))
          hits=[]
          for row in d.get('states') or []:
              if not isinstance(row,list) or len(row)<11: continue
              cs=str(row[1] or '').strip().upper().replace(' ','')
              if cs=='NBT50K':
                  hits.append({'hex':row[0],'callsign':cs,'lon':row[5],'lat':row[6]})
          print('OpenSky NBT50K matches:',hits)
          print('OpenSky miss is allowed; V2.4 never relies on one provider.')
          PY
