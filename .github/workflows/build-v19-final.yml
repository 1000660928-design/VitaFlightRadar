name: Build VitaFlightRadar v1.9 Final

on:
  workflow_dispatch:
  push:
    branches: ["v19-build"]
    paths:
      - ".github/workflows/build-v19-final.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08-20260813
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v1.9 source
        run: |
          cat source.part1.b64 source.part2.b64 source.part3a.b64 source.part3b.b64 source.part4.b64 source.part5.b64 | base64 -d > base.zip
          echo "435d57e62e1b8b97011271615d02bd7c9166251fdddb206731fbb2c07626b6a1  base.zip" | sha256sum -c -
          python3 -c "import zipfile; z=zipfile.ZipFile('base.zip'); assert z.testzip() is None; z.extractall('.')"

          cat patches/v12_patch.part1a.b64 patches/v12_patch.part1b.b64 patches/v12_patch.part2.b64 patches/v12_patch.part3.b64 | base64 -d > p.zip
          echo "81fd38aa36349286088a9ed04b6b0b5055fda5bf7305d093405fc011a09b4b19  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          cat patches/v13_patch.part*.b64 | base64 -d > p.zip
          echo "9a4c130f4d5ed5b4f0efcae4ec11745f87fc1bba2fcf90f877ce448c278b8487  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          cat patches/v14_patch.part01.b64 patches/v14_patch.part02.b64 patches/v14_patch.part03.b64 patches/v14_patch.part04.b64 | base64 -d > p.zip
          echo "747b1fa093bc3d376e28cab7df717f42206828fc041f55950280c1435cab1edb  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          cat patches/v15_patch.part01.b64 patches/v15_patch.part02.b64 patches/v15_patch.part03.b64 patches/v15_patch.part04.b64 | base64 -d > p.zip
          echo "ab10424241314ce2a7a1bcc4e7bba06e52684ff0e93df5ba81aab752497b8fbb  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          cat patches/v16_patch.part01a.b64 patches/v16_patch.part01b.b64 patches/v16_patch.part02.b64 patches/v16_patch.part03.b64 | base64 -d > p.zip
          echo "f143e973382a345516d66f3ea9c56ddceefec03784407910f8a7d7eab67e050f  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          echo "c1f7f5c24c25d7113dedee3b8404d746a2cecf57f97f8f2c98f0f9f8984fa08b  patches/v17_patch.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('patches/v17_patch.zip').extractall('VitaFlightRadar/src')"

          cat patches/v18_patch.part01.b64 patches/v18_patch.part02.b64 patches/v18_patch.part03.b64 patches/v18_patch.part04.b64 patches/v18_patch.part05.b64 | base64 -d > p.zip
          echo "c813625aaa9fc8b5745f3639a9dd0d10692bba1ad52aa94d41c643ea09c0213d  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          cat patches/v19_patch.x00.b64 patches/v19_patch.x01.b64 patches/v19_patch.x02.b64 patches/v19_patch.x03.b64 patches/v19_patch.x04.b64 patches/v19_patch.x05.b64 patches/v19_patch.x06.b64 patches/v19_patch.x07.b64 | base64 -d > p.zip
          echo "d9b829c5c32d90878a612a3b670c006f9811a60b02acf6a0ffb351b9b5fb762c  p.zip" | sha256sum -c -
          python3 -c "import zipfile; zipfile.ZipFile('p.zip').extractall('VitaFlightRadar/src')"

          # Stability first: keep the async performance architecture but do not force Vita CPU/GPU clocks.
          sed -i '/scePowerSetArmClockFrequency/d;/scePowerSetBusClockFrequency/d;/scePowerSetGpuClockFrequency/d;/scePowerSetGpuXbarClockFrequency/d;/scePowerSetUsingWireless/d' VitaFlightRadar/src/main.c

          echo "6e1784d4e27c75f2bd3052078a974dfd931725612a0e716f01326e258a18e14d  patches/icon_fix.zip.b64" | sha256sum -c -
          base64 -d patches/icon_fix.zip.b64 > icon.zip
          python3 -c "import zipfile; zipfile.ZipFile('icon.zip').extractall('VitaFlightRadar/sce_sys')"
          echo "7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d  VitaFlightRadar/sce_sys/icon0.png" | sha256sum -c -

      - name: Build Vita-safe Jansson
        run: |
          git clone --depth 1 --branch v2.15.1 https://github.com/akheron/jansson.git jansson-src
          sed -i 's/POSITION_INDEPENDENT_CODE true/POSITION_INDEPENDENT_CODE false/' jansson-src/CMakeLists.txt
          cmake -S jansson-src -B jansson-build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=OFF -DCMAKE_C_FLAGS='-O3 -fno-pic -fno-pie' -DJANSSON_BUILD_DOCS=OFF -DJANSSON_EXAMPLES=OFF -DJANSSON_WITHOUT_TESTS=ON
          cmake --build jansson-build --parallel
          cp "$(find jansson-build -name libjansson.a -type f | head -n1)" VitaFlightRadar/libjansson_vita.a

      - name: Configure v1.9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('VitaFlightRadar/CMakeLists.txt'); s=p.read_text()
          s=s.replace('set(VITA_VERSION "01.00")','set(VITA_VERSION "01.90")')
          s=s.replace('find_package(CURL REQUIRED)\n','').replace('find_package(OpenSSL REQUIRED)\n','')
          s=s.replace('    ${CURL_INCLUDE_DIRS}\n','').replace('    ${OPENSSL_INCLUDE_DIR}\n','')
          s=s.replace('    ${CURL_LIBRARIES}\n','').replace('    ${OPENSSL_LIBRARIES}\n','')
          s=s.replace('    jansson\n','    ${CMAKE_SOURCE_DIR}/libjansson_vita.a\n')
          s=s.replace('    src/net.c\n)','    src/net.c\n    src/map.c\n    src/route.c\n)')
          s=s.replace('    SceKernelThreadMgr_stub\n','    SceKernelThreadMgr_stub\n    SceRtc_stub\n    SceAppUtil_stub\n    SceIme_stub\n')
          s=s.replace('set(CMAKE_C_STANDARD_REQUIRED ON)','set(CMAKE_C_STANDARD_REQUIRED ON)\nset(CMAKE_POSITION_INDEPENDENT_CODE OFF)\nadd_compile_options(-O3 -fomit-frame-pointer -ffunction-sections -fdata-sections -fno-pic -fno-pie)\nadd_link_options(-no-pie -Wl,--gc-sections)')
          s=s.replace('target_include_directories(${PROJECT_NAME} PRIVATE','set_target_properties(${PROJECT_NAME} PROPERTIES POSITION_INDEPENDENT_CODE OFF)\n\ntarget_include_directories(${PROJECT_NAME} PRIVATE')
          p.write_text(s)
          PY
          cmake -S VitaFlightRadar -B VitaFlightRadar/build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: cmake --build VitaFlightRadar/build --parallel

      - name: Verify VPK
        run: |
          python3 - <<'PY'
          import zipfile,hashlib
          p='VitaFlightRadar/build/VitaFlightRadar.vpk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('sce_sys/icon0.png')).hexdigest()=='7918a7a0f1323bfa5f00b529578a5d0594ab49c54f357c3170508e650a50023d'
          print('v1.9 verified')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: VitaFlightRadar-v1.9-VPK
          path: VitaFlightRadar/build/VitaFlightRadar.vpk
          if-no-files-found: error
